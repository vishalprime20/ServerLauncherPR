name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ServerLauncherPython
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build app folder
        working-directory: ServerLauncherPython
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx `
            --name ServerLauncherPR `
            --icon assets/icon.ico `
            --version-file file_version_info.txt `
            --hidden-import PIL `
            --add-data "assets/logo_compact.gif;assets" `
            --add-data "assets/logo_preview.png;assets" `
            --add-data "assets/logo_ui.png;assets" `
            --add-data "assets/icon.ico;assets" `
            --add-data "assets/icon.png;assets" `
            server_launcher.py

      - name: Zip app folder
        working-directory: ServerLauncherPython/dist
        run: Compress-Archive -Path ServerLauncherPR -DestinationPath ServerLauncherPR-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerLauncherPR-windows
          path: ServerLauncherPython/dist/ServerLauncherPR-windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Server Launcher v1.0.${{ github.run_number }}
          body: |
            Windows Defender often blocks a single unsigned `.exe`. This release is a **folder app**.

            1. Download **ServerLauncherPR-windows.zip**
            2. Right-click the zip → **Properties** → check **Unblock** → Apply
            3. Extract the zip
            4. Open `ServerLauncherPR\ServerLauncherPR.exe` with a normal double-click (not Run as administrator)

            If Defender still blocks it: Windows Security → Virus & threat protection → Protection history → Allow on device.
          files: ServerLauncherPython/dist/ServerLauncherPR-windows.zip
          make_latest: true
